<svg viewBox="0 0 720 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="760" fill="#ffffff"/>
  <!-- forward spine boxes -->
  <g>
    <!-- PLANNED -->
    <rect x="40" y="20" width="300" height="56" rx="7" fill="#e7f0e2" stroke="#a3c490" stroke-width="1.4"/>
    <text x="190" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a5a2a">PLANNED</text>
    <text x="190" y="61" text-anchor="middle" font-size="10.5" fill="#5a7a4a">Planner builds the per-app migration plan</text>
    <!-- PROVISIONING -->
    <rect x="40" y="100" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">PROVISIONING_TARGET_QM</text>
    <text x="190" y="141" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Deploy dedicated target QM, realize MQ objects</text>
    <!-- VALIDATING_PRE -->
    <rect x="40" y="180" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="202" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">VALIDATING_PRE</text>
    <text x="190" y="221" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Confirm target QM reachable, channels running</text>
    <!-- REWIRING -->
    <rect x="40" y="260" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">REWIRING</text>
    <text x="190" y="301" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Source queues redefined as QREMOTE aliases</text>
    <!-- DRAIN_WAIT -->
    <rect x="40" y="340" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="362" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">DRAIN_WAIT</text>
    <text x="190" y="381" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Predict drain time from depth — Little's Law</text>
    <!-- VALIDATING_DURING -->
    <rect x="40" y="420" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="442" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">VALIDATING_DURING</text>
    <text x="190" y="461" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Check message flow over the new path</text>
    <!-- DRAINING_SOURCE -->
    <rect x="40" y="500" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="522" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">DRAINING_SOURCE</text>
    <text x="190" y="541" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Poll source queue to confirmed zero depth</text>
    <!-- VALIDATING_POST -->
    <rect x="40" y="580" width="300" height="56" rx="7" fill="#e6effa" stroke="#9cb9da" stroke-width="1.4"/>
    <text x="190" y="602" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f3f6b">VALIDATING_POST</text>
    <text x="190" y="621" text-anchor="middle" font-size="10.5" fill="#3f5f8b">Final check — app fully served by target QM</text>
    <!-- COMPLETED -->
    <rect x="40" y="660" width="300" height="56" rx="7" fill="#dcefd2" stroke="#7faf68" stroke-width="1.6"/>
    <text x="190" y="682" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2f5a1a">COMPLETED</text>
    <text x="190" y="701" text-anchor="middle" font-size="10.5" fill="#4a7a3a">App migrated — source queues removed</text>
  </g>
  <!-- spine arrows -->
  <g stroke="#888" stroke-width="1.5" fill="#888">
    <line x1="190" y1="76" x2="190" y2="100"/><polygon points="190,100 185,90 195,90"/>
    <line x1="190" y1="156" x2="190" y2="180"/><polygon points="190,180 185,170 195,170"/>
    <line x1="190" y1="236" x2="190" y2="260"/><polygon points="190,260 185,250 195,250"/>
    <line x1="190" y1="316" x2="190" y2="340"/><polygon points="190,340 185,330 195,330"/>
    <line x1="190" y1="396" x2="190" y2="420"/><polygon points="190,420 185,410 195,410"/>
    <line x1="190" y1="476" x2="190" y2="500"/><polygon points="190,500 185,490 195,490"/>
    <line x1="190" y1="556" x2="190" y2="580"/><polygon points="190,580 185,570 195,570"/>
    <line x1="190" y1="636" x2="190" y2="660"/><polygon points="190,660 185,650 195,650"/>
  </g>
  <!-- failure branch -->
  <g>
    <rect x="420" y="100" width="260" height="56" rx="7" fill="#fbeede" stroke="#e0b884" stroke-width="1.4"/>
    <text x="550" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a5a1a">ROLLING_BACK</text>
    <text x="550" y="141" text-anchor="middle" font-size="10.5" fill="#a06b2a">Any step fails — undo in reverse order</text>
    <rect x="420" y="190" width="260" height="56" rx="7" fill="#f7e0e0" stroke="#d69a9a" stroke-width="1.4"/>
    <text x="550" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a2a2a">ROLLED_BACK</text>
    <text x="550" y="231" text-anchor="middle" font-size="10.5" fill="#a05050">Source restored — failure in audit log</text>
    <rect x="420" y="280" width="260" height="56" rx="7" fill="#f7e0e0" stroke="#d69a9a" stroke-width="1.4"/>
    <text x="550" y="302" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a2a2a">ROLLBACK_FAILED</text>
    <text x="550" y="321" text-anchor="middle" font-size="10.5" fill="#a05050">Terminal — needs manual recovery</text>
  </g>
  <!-- failure arrows -->
  <g stroke="#e0a060" stroke-width="1.5" stroke-dasharray="5 4" fill="#e0a060">
    <line x1="340" y1="128" x2="420" y2="128"/><polygon points="420,128 410,123 410,133"/>
  </g>
  <g stroke="#d69a9a" stroke-width="1.5" fill="#d69a9a">
    <line x1="550" y1="156" x2="550" y2="190"/><polygon points="550,190 545,180 555,180"/>
    <line x1="550" y1="246" x2="550" y2="280"/><polygon points="550,280 545,270 555,270"/>
  </g>
  <!-- restart dashed -->
  <g stroke="#5aa86a" stroke-width="1.5" stroke-dasharray="6 4" fill="#5aa86a">
    <path d="M 680 218 Q 700 218 700 130 Q 700 48 340 48" fill="none"/>
    <polygon points="340,48 350,43 350,53"/>
  </g>
  <text x="560" y="380" text-anchor="middle" font-size="10.5" fill="#4a8a5a">Operator restarts —</text>
  <text x="560" y="395" text-anchor="middle" font-size="10.5" fill="#4a8a5a">record recycles to PLANNED</text>
</svg>
